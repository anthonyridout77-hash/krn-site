name: tmp old-site cleanup
on:
  push:
    branches: [old-site-reference-cleanup]
    paths: [".github/workflows/tmp-old-site-cleanup.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point migrated addresses at www
        run: |
          grep -rl "https://api.katridout.com.au/" content --include="*.md" | xargs sed -i "s#https://api\.katridout\.com\.au/#https://www.katridout.com.au/#g"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "content: point migrated page addresses at www instead of the old api host"
          git push
