name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check internal links
        # Non-blocking: reports broken internal links in the built HTML.
        continue-on-error: true
        run: |
          npx --yes linkinator@6 ./dist \
            --recurse \
            --skip "^(?!file://)" \
            --verbosity error

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 7
