name: IndexNow

# Tells Bing / Copilot (and anything else on IndexNow) about every URL in the live
# sitemap after each deploy to main, and once a day as a safety net.
# Key file: site/public/246d09f9af65184ef036da8f9986cd6f.txt (served at the site root).

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 19 * * *'   # 05:30 Brisbane
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deploy
        if: github.event_name == 'push'
        run: sleep 240

      - name: Submit sitemap URLs to IndexNow
        run: |
          set -euo pipefail
          HOST=www.katridout.com.au
          KEY=246d09f9af65184ef036da8f9986cd6f
          curl -fsSL "https://$HOST/sitemap-0.xml" -o sitemap.xml
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sort -u > urls.txt
          echo "URLs: $(wc -l < urls.txt)"
          jq -Rn --arg host "$HOST" --arg key "$KEY" \
            '{host:$host, key:$key, keyLocation:("https://"+$host+"/"+$key+".txt"), urlList:[inputs]}' \
            urls.txt > payload.json
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP $code"; cat resp.txt || true
          case "$code" in 200|202) ;; *) exit 1;; esac
